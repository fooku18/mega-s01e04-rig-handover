# Plan morning-digest § 3/§ 4, ADR 0003. Saves /digest/2026-10-28 as one HTML file and deploys it
# to GitHub Pages. The file is never committed. Run it again with `marker` off to upload the same
# page with LANE_MARKER unset over the same link.
name: preview

on:
  workflow_dispatch:
    inputs:
      night:
        description: Night to preview
        default: '2026-10-28'
      marker:
        description: Show the lane marker in the banner (off for clean-up)
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.11.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Save the page
        env:
          LANE_MARKER: ${{ inputs.marker && secrets.LANE_MARKER || '' }}
          NIGHT: ${{ inputs.night }}
        run: |
          pnpm start &
          for i in $(seq 30); do curl -sf http://localhost:8787/health && break; sleep 1; done
          mkdir -p _site
          curl -sf "http://localhost:8787/digest/$NIGHT" -o _site/index.html
          if grep -q 'no marker set' _site/index.html; then echo "banner: no marker set"; else echo "banner: marker set"; fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
